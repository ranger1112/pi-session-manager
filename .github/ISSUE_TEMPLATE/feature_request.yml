name: 功能建议
description: 提出新功能或改进
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与当前的不便，而不是直接给出实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: false

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      description: 本插件坚持只读、不删除会话、不发起网络请求；建议需在此范围内
      options:
        - label: 该建议不要求删除、重命名或写入会话文件
          required: true
        - label: 该建议不要求把无法核验的会话强行隐藏
          required: true
