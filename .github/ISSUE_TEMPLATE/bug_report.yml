name: Bug 报告
description: 报告可复现的问题
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴真实会话内容、凭据或日志；用合成会话描述问题即可。
        安全问题请按 [SECURITY.md](https://github.com/ranger1112/pi-session-manager/blob/main/SECURITY.md) 私密报告。

  - type: input
    id: version
    attributes:
      label: 插件版本
      description: tag 或提交哈希
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: pi-version
    attributes:
      label: Pi / Pi TUI 版本
      placeholder: 1.4.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: 22.21.1
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
        - 其他
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 使用的命令
      options:
        - /sessions
        - /sessions all
        - /sessions agents
        - /sessions all agents
        - /resume-main
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用合成会话说明；注明是否启用了其他注册 /sessions 的扩展
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已移除真实会话内容、凭据和日志
          required: true
        - label: 我已搜索现有 issue，未找到重复项
          required: true
